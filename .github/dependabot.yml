version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # Vite, its plugins and Tailwind declare peer ranges on each other (e.g. plugin-react 6 needs
      # vite 8, @tailwindcss/vite must allow it). Bumping them one by one fails `npm install`,
      # so they always move together in a single PR. Listed first so it wins over the group below.
      vite-toolchain:
        patterns:
          - "vite"
          - "vite-node"
          - "vitest"
          - "@vitejs/*"
          - "@tailwindcss/*"
          - "tailwindcss"
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/environments/*
      - /infra/terraform/modules/*
    schedule: { interval: weekly }
