name: Terraform

# PR   -> fmt + validate + security scan + plan (posted as a PR comment, read-only AWS role)
# main -> same checks, then apply AFTER manual approval of the "production" GitHub Environment.
on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.7"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: infra/terraform/environments/prod

jobs:
  validate:
    name: fmt, validate, scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra/terraform
      - name: Validate every root module
        run: |
          set -euo pipefail
          for dir in infra/terraform/bootstrap infra/terraform/environments/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - run: pipx run --spec checkov==3.3.30 checkov --config-file .checkov.yaml --directory infra/terraform

  plan:
    name: plan (pull request)
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform -chdir="$WORKDIR" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan
        run: terraform -chdir="$WORKDIR" plan -no-color -var-file=../../environment.tfvars -var-file=prod.tfvars | tee "$RUNNER_TEMP/plan.txt"
      - name: Comment the plan on the PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            let plan = fs.existsSync(process.env.PLAN_FILE) ? fs.readFileSync(process.env.PLAN_FILE, 'utf8') : 'No plan output.';
            if (plan.length > 60000) plan = plan.slice(-60000);
            const body = '### Terraform plan (prod)\n\n```\n' + plan + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  apply:
    name: apply (needs approval)
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # first apply waits for ACM validation + CloudFront deployment
    environment:
      name: production   # configure "Required reviewers" on this environment in GitHub settings
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform -chdir="$WORKDIR" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir="$WORKDIR" plan -no-color -var-file=../../environment.tfvars -var-file=prod.tfvars -out=tfplan
      - run: terraform -chdir="$WORKDIR" apply -no-color tfplan