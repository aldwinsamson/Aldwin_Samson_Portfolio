name: Deploy to AWS (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag or commit SHA) to deploy. Use an older SHA to roll back.
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:knowledge
      - run: npm run build
        env:
          VITE_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Publish to S3 + invalidate CloudFront
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write   
      contents: read
    env:
      BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload (assets first, index.html last — visitors never see a half-deployed site)
        run: |
          set -euo pipefail
          # 1) Content-hashed bundles: cache for a year. Old hashes stay until you prune them.
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors
          # 2) Everything else (images, robots, sitemap, ...). --delete only touches these keys.
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --exclude "index.html" --delete \
            --cache-control "public, max-age=3600" --only-show-errors
          # 3) The entry point last, and never cached by browsers without revalidation.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8" --only-show-errors

      - name: Invalidate CloudFront and wait
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
                --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$ID"

      - name: Smoke test the CloudFront address (works even while the domain points to Vercel)
        run: |
          set -euo pipefail
          CF_DOMAIN=$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query Distribution.DomainName --output text)
          bash scripts/smoke-test.sh "https://$CF_DOMAIN"
