fullnameOverride: kps

kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { memory: 128Mi }

prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    retention: 3d
    retentionSize: 3GB
    scrapeInterval: 60s
    evaluationInterval: 60s
    walCompression: true
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits: { memory: 700Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  service:
    type: NodePort
    nodePort: 30903
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 64Mi }

grafana:
  defaultDashboardsTimezone: Asia/Manila
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 30300
  persistence:
    enabled: false  
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  resources:
    requests: { cpu: 25m, memory: 100Mi }
    limits: { memory: 256Mi }
  additionalDataSources:
    - name: CloudWatch
      uid: cloudwatch
      type: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: us-east-1   

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 48Mi }
