# Picked up automatically by the Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-portfolio
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  portfolio-uptime.json: |
    {
      "uid": "portfolio-uptime",
      "title": "Portfolio \u2014 uptime & edge traffic",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": [
        "portfolio"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "timezone": "Asia/Manila",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Site status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(probe_success{job=\"probe/monitoring/portfolio-site\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "green"
                    },
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    }
                  }
                }
              ]
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Response time (avg)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg(probe_duration_seconds{job=\"probe/monitoring/portfolio-site\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "TLS certificate days left",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min((probe_ssl_earliest_cert_expiry{job=\"probe/monitoring/portfolio-site\"} - time()) / 86400)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "d"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "HTTP status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(probe_http_status_code{job=\"probe/monitoring/portfolio-site\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Probe duration by URL",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "probe_duration_seconds{job=\"probe/monitoring/portfolio-site\"}",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CloudFront requests (CloudWatch)",
          "datasource": {
            "type": "cloudwatch",
            "uid": "cloudwatch"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "cloudwatch",
                "uid": "cloudwatch"
              },
              "queryMode": "Metrics",
              "namespace": "AWS/CloudFront",
              "metricName": "Requests",
              "dimensions": {
                "DistributionId": "*",
                "Region": "Global"
              },
              "matchExact": false,
              "statistic": "Sum",
              "period": "300",
              "region": "us-east-1",
              "id": "",
              "expression": "",
              "label": "requests"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ]
    }
