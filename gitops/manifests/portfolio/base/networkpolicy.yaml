# Static web server: accepts traffic on 8080 only, may not initiate any connection.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress: []
